<script>
  // Apply session category filter or URL query param
  document.addEventListener("DOMContentLoaded", () => {
    const params = new URLSearchParams(window.location.search);
    const urlCat = params.get("cat");
    const urlQuery = params.get("q");
    const storedCat = sessionStorage.getItem("mslr_cat_filter");

    const activeCat = urlCat || storedCat || null;
    sessionStorage.removeItem("mslr_cat_filter");

    if (activeCat) {
      const btn = document.querySelector(`[data-category="${activeCat}"]`);
      if (btn) {
        document.querySelectorAll("[data-category]").forEach(b => b.classList.remove("active-cat"));
        btn.classList.add("active-cat");
        btn.click();
      }
    }

    if (urlQuery) {
      const searchInput = document.getElementById("shop-search");
      if (searchInput) {
        searchInput.value = urlQuery;
        searchInput.dispatchEvent(new Event("input"));
      }
    }
  });
</script>
