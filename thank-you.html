<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <script>
    (function() {
      const lang = localStorage.getItem("mslr_lang") || "en";
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
      const observer = new MutationObserver(() => {
        if (document.body) {
          document.body.classList.add(lang === "ar" ? "rtl" : "ltr");
          observer.disconnect();
        }
      });
      observer.observe(document.documentElement, { childList: true });
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You — MSLR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/loader.css">
  <!-- Preload Arabic Font for Performance -->
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;700;900&display=swap" as="style">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;700;900&display=swap" media="print" onload="this.media='all'">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { lime: { 400: '#c8f400', 300: '#d6f733', 500: '#a8cc00' } },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
</head>
<body class="bg-[#00312D] text-[#f5f5f5] font-sans min-h-screen flex flex-col" data-page="thankyou">

    </svg>
  </div>
</div>


<!-- Minimal nav -->
<nav class="px-5 lg:px-8 h-16 flex items-center justify-between border-b border-white/5">
  <a href="index.html">
    <img src="images/logopage.svg" alt="MSLR Logo" class="logo-img" />
  </a>
  <!-- Language Switcher -->
  <div class="lang-switcher">
    <button class="lang-btn" data-lang="en" aria-label="Switch to English">EN</button>
    <button class="lang-btn" data-lang="ar" aria-label="Switch to Arabic">AR</button>
    <div class="lang-indicator"></div>
  </div>
</nav>

<!-- MAIN CONTENT -->
<main class="flex-1 flex items-center justify-center px-5 py-20">
  <div class="text-center max-w-lg" id="ty-content">

    <!-- Logo -->
    <div class="mb-10">
      <img src="assets/logo/mslr-logo.png" alt="MSLR" class="thank-you-logo h-16 mx-auto" onerror="this.outerHTML='<div class=&quot;thank-you-logo inline-block text-lime-400 font-black text-5xl tracking-widest&quot;>MSLR</div>'">
    </div>

    <!-- Check icon -->
    <div class="w-20 h-20 rounded-full bg-lime-400/10 border-2 border-lime-400/30 flex items-center justify-center mx-auto mb-8" id="ty-check">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#c8f400" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>

    <!-- Heading -->
    <h1 id="ty-title" class="text-[clamp(2rem,5vw,3.5rem)] font-black tracking-tight leading-tight mb-4" style="opacity:0" data-i18n="ty_title">
      Thank You for<br><span class="text-lime-400">Your Order</span>
    </h1>

    <!-- Message -->
    <p id="ty-msg" class="text-gray-400 text-lg leading-relaxed mb-4" style="opacity:0" data-i18n="ty_msg">
      We received your request on WhatsApp and will contact you soon.
    </p>
    <p id="ty-msg2" class="text-gray-500 text-sm mb-12" style="opacity:0" data-i18n="ty_msg2">
      Our team typically responds within 1–2 hours during business hours. Keep an eye on your WhatsApp messages.
    </p>

    <!-- Actions -->
    <div id="ty-actions" class="flex flex-col sm:flex-row gap-4 justify-center" style="opacity:0">
      <a href="shop.html" class="btn-primary justify-center" data-i18n="ty_continue">
        Continue Shopping
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </a>
      <a href="index.html" class="btn-outline justify-center border-white/10" data-i18n="ty_home">Back to Home</a>
    </div>

    <!-- Order ref -->
    <p id="ty-ref" class="mt-10 text-xs text-gray-700" style="opacity:0">
      Order Reference: <span id="order-ref" class="text-gray-500 font-mono"></span>
    </p>
  </div>
</main>

<!-- Particles / BG decoration -->
<div class="fixed inset-0 pointer-events-none overflow-hidden z-0" aria-hidden="true">
  <div class="absolute top-1/4 -left-20 w-80 h-80 rounded-full bg-lime-400/3 blur-3xl"></div>
  <div class="absolute bottom-1/4 -right-20 w-80 h-80 rounded-full bg-lime-400/3 blur-3xl"></div>
</div>

<!-- FOOTER -->
<footer class="bg-[#080808] border-t border-white/5 py-6 px-5 lg:px-8">
  <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-3">
    <p class="text-gray-600 text-xs">&copy; 2025 MSLR. All rights reserved.</p>
    <div class="flex gap-4">
      <a href="shop.html" class="text-gray-500 hover:text-lime-400 text-sm transition-colors">Shop</a>
      <a href="https://wa.me/212600000000" target="_blank" class="text-gray-500 hover:text-lime-400 text-sm transition-colors">WhatsApp</a>
    </div>
  </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
<script src="js/loader.js"></script>

<script src="js/products.js"></script>
<script src="js/app.js"></script>
<script>
  // Generate order ref
  document.getElementById("order-ref").textContent = "MSLR-" + Date.now().toString(36).toUpperCase();

  document.addEventListener("DOMContentLoaded", () => {
    if (!window.anime) {
      ["ty-title","ty-msg","ty-msg2","ty-actions","ty-ref"].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.opacity = "1";
      });
      return;
    }

    // Check icon draw
    anime({
      targets: "#ty-check",
      scale: [0, 1],
      opacity: [0, 1],
      duration: 600,
      delay: 200,
      easing: "easeOutBack"
    });

    // Stagger text
    anime({
      targets: ["#ty-title", "#ty-msg", "#ty-msg2", "#ty-actions", "#ty-ref"],
      translateY: [24, 0],
      opacity: [0, 1],
      delay: anime.stagger(120, { start: 500 }),
      duration: 700,
      easing: "easeOutCubic"
    });

    // Logo pulse
    anime({
      targets: ".thank-you-logo",
      scale: [0.8, 1],
      opacity: [0, 1],
      duration: 800,
      easing: "easeOutBack"
    });
  });
</script>
</body>
</html>
